<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title>
<style>body{margin:0;font:16px Arial;background:#f5f6f8;color:#111827}.wrap{max-width:900px;margin:auto;padding:20px}.box{background:white;border:1px solid #ddd;border-radius:15px;padding:20px;margin-bottom:18px}input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box;margin:6px 0}.btn{border:0;border-radius:9px;padding:11px 15px;background:#111827;color:#fff;font-weight:bold;cursor:pointer}.orange{background:#ff9900;color:#111}.danger{background:#fee2e2;color:#991b1b}.item{display:flex;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid #eee}.small{color:#777;font-size:13px}@media(max-width:600px){.item{flex-direction:column}}</style></head><body><div class="wrap">
<h1>Private Product Admin</h1><div id="status" class="box">Checking login...</div><div id="app" style="display:none">
<div class="box"><h2 id="ft">Add product</h2><input id="name" placeholder="Product name"><input id="category" placeholder="Category"><input id="image" placeholder="Product image URL"><input id="amazon" placeholder="Your Amazon Associates affiliate URL"><textarea id="desc" placeholder="Short description"></textarea><button class="btn orange" onclick="saveProduct()">Save</button> <button class="btn" onclick="resetForm()">Cancel</button></div>
<div class="box"><h2>Your products</h2><div id="list"></div></div></div></div>
<script>
const SUPABASE_URL="Yhttps://cxjnyymgctrgcyhnsdpk.supabase.co",SUPABASE_ANON_KEY="sb_publishable_amSzXni2yDgCdJE2sH-ddw_SpPdWwBS";let token="",editing=null,products=[];
const esc=s=>String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function api(path,opt={}){return fetch(SUPABASE_URL+path,{...opt,headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+token,"Content-Type":"application/json",...(opt.headers||{})}})}
function loginUI(){status.innerHTML='<h2>Admin login</h2><p class="small">Only your Supabase admin account should be used here.</p><input id="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="btn" onclick="login()">Log in</button>'}
async function login(){let r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{apikey:SUPABASE_ANON_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:pw.value})});let d=await r.json();if(!r.ok){alert(d.error_description||"Login failed");return}token=d.access_token;localStorage.setItem("sb_token",token);start()}
async function start(){if(SUPABASE_URL.startsWith("YOUR_")){status.textContent="Setup required: add your Supabase URL and anon key.";return}token=localStorage.getItem("sb_token")||"";if(!token){loginUI();return}let r=await api("/auth/v1/user");if(!r.ok){localStorage.removeItem("sb_token");token="";loginUI();return}status.style.display="none";app.style.display="block";load()}
async function load(){let r=await api("/rest/v1/products?select=*&order=created_at.desc");products=await r.json();render()}
function render(){list.innerHTML=products.length?products.map(p=>'<div class="item"><div><b>'+esc(p.name)+'</b><div class="small">'+esc(p.category||"")+'</div></div><div><button class="btn" onclick="editP(\''+p.id+'\')">Edit</button> <button class="btn danger" onclick="delP(\''+p.id+'\')">Delete</button></div></div>').join(""):'<p class="small">No products yet.</p>'}
function editP(id){let p=products.find(x=>x.id===id);editing=id;name.value=p.name;category.value=p.category||"";image.value=p.image_url||"";amazon.value=p.amazon_url;desc.value=p.description||"";ft.textContent="Edit product"}
function resetForm(){editing=null;name.value=category.value=image.value=amazon.value=desc.value="";ft.textContent="Add product"}
async function saveProduct(){let b={name:name.value.trim(),category:category.value.trim(),image_url:image.value.trim(),amazon_url:amazon.value.trim(),description:desc.value.trim()};if(!b.name||!b.amazon_url){alert("Name and Amazon link are required.");return}let r=await api(editing?"/rest/v1/products?id=eq."+editing:"/rest/v1/products",{method:editing?"PATCH":"POST",headers:{Prefer:"return=representation"},body:JSON.stringify(b)});if(!r.ok){alert(await r.text());return}resetForm();load()}
async function delP(id){if(!confirm("Delete this product?"))return;let r=await api("/rest/v1/products?id=eq."+id,{method:"DELETE"});if(!r.ok)alert(await r.text());else load()}
start();
</script></body></html>
